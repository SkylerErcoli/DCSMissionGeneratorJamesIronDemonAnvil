[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iron-anvil-missions"
version = "1.3.0"
description = "Desktop cooperative single-mission generator for DCS World"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
ironanvil = "ironanvil.__main__:main"

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["ironanvil*"]

[tool.setuptools.package-data]
ironanvil = ["*.lua", "assets/*", "assets/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
