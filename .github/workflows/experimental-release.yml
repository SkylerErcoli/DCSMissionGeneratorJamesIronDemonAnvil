name: Experimental co-op preview

on:
  workflow_dispatch:
  push:
    branches: [experimental]
    paths:
      - '.github/workflows/experimental-release.yml'
      - 'ironanvil/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tools/build_experimental_windows.ps1'
      - 'tests/**'
      - 'docs/experimental/START-HERE.txt'

permissions:
  contents: read

concurrency:
  group: experimental-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Experimental source and Lua regression checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1 xvfb python3-tk
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - run: xvfb-run -a python -m pytest -q
      - run: python tools/test_matrix.py --lua lua5.1

  windows:
    name: Build experimental app and prove stable coexistence
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - run: python -m pytest -q --ignore=tests/test_runtime.py --junitxml=test-results/experimental-source.xml
      - name: Build and test frozen/installed apps and published stable sibling
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          ./tools/build_experimental_windows.ps1 -SkipInstall *>&1 | Tee-Object -FilePath test-results/experimental-build.log
      - name: Public validation summary
        if: always()
        shell: pwsh
        run: |
          $Summary = [Collections.Generic.List[string]]::new()
          $Summary.Add('## Experimental preview validation')
          $Summary.Add('Commit: `${{ github.sha }}`')
          if (Test-Path 'test-results/experimental-source.xml') {
            [xml]$JUnit = Get-Content 'test-results/experimental-source.xml' -Raw
            foreach ($Suite in $JUnit.testsuites.testsuite) {
              $Summary.Add("Source tests: $($Suite.tests); failures: $($Suite.failures); errors: $($Suite.errors); skipped: $($Suite.skipped).")
            }
          }
          foreach ($Name in @('frozen-self-test', 'frozen-smoke-gui', 'installed-self-test', 'installed-smoke-gui', 'coexistence-validation', 'stable-after-experimental')) {
            $Report = "test-results/$Name.json"
            if (Test-Path $Report) {
              $Summary.Add("### $Name")
              $Summary.Add('```json')
              $Summary.Add((Get-Content $Report -Raw))
              $Summary.Add('```')
            }
          }
          if ('${{ job.status }}' -ne 'success' -and (Test-Path 'test-results/experimental-build.log')) {
            $Summary.Add('### Last build output')
            $Summary.Add('```text')
            $Summary.Add(((Get-Content 'test-results/experimental-build.log' -Tail 100) -join "`n"))
            $Summary.Add('```')
          }
          $Summary -join "`n`n" | Add-Content $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IronAnvil-Experimental-Windows
          path: |
            dist/IronAnvil-Experimental-Setup-x64.exe
            dist/IronAnvil-Experimental-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Experimental-validation
          path: test-results/
          if-no-files-found: warn

  publish:
    name: Publish experimental prerelease only
    needs: [linux, windows]
    if: github.ref == 'refs/heads/experimental'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: IronAnvil-Experimental-Windows
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Experimental-validation
          path: release-assets/validation
      - env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(python -c 'import ast; p=ast.parse(open("ironanvil/__init__.py").read()); print(next(ast.literal_eval(s.value) for s in p.body if isinstance(s, ast.Assign) and any(isinstance(t, ast.Name) and t.id == "RELEASE_TAG" for t in s.targets)))')
          [[ "$tag" == *-experimental.* ]]
          (cd release-assets && sha256sum --check SHA256SUMS.txt)
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "This immutable prerelease already exists; updated builds remain workflow artifacts. Bump RELEASE_TAG for another preview."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --prerelease --latest=false --title "Iron Anvil Experimental — first co-op preview" --notes-file docs/releases/v1.3.0-experimental.1.md release-assets/IronAnvil-Experimental-Setup-x64.exe release-assets/IronAnvil-Experimental-Windows-x64.zip release-assets/SHA256SUMS.txt release-assets/validation/frozen-self-test.json release-assets/validation/frozen-smoke-gui.json release-assets/validation/installed-self-test.json release-assets/validation/installed-smoke-gui.json release-assets/validation/coexistence-validation.json release-assets/validation/stable-after-experimental.json
          fi
