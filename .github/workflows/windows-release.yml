name: Windows app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-release.yml'
      - 'ironanvil/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'tools/build_windows.ps1'
      - 'tools/write_update_manifest.py'
      - 'tools/test_matrix.py'
      - 'tests/**'
      - 'docs/START-HERE.txt'

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-runtime:
    name: Lua and Linux regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install verified runtime prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y lua5.1 xvfb python3-tk
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Test application and DCS Lua controller
        run: xvfb-run -a python -m pytest -q
      - name: Generate and reload mission matrix
        run: python tools/test_matrix.py --lua lua5.1

  build:
    name: Build and test the actual Windows executable
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install pinned build dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt
      - name: Test on Windows (Lua tests run in the Linux job)
        run: python -m pytest -q --ignore=tests/test_runtime.py --junitxml=test-results/windows-source.xml
      - name: Build portable app and verify without Python on PATH
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          ./tools/build_windows.ps1 -SkipInstall *>&1 | Tee-Object -FilePath test-results/build-windows.log
      - name: Write public validation summary
        if: always()
        shell: pwsh
        run: |
          $Summary = [System.Collections.Generic.List[string]]::new()
          $Summary.Add('## Windows application validation')
          $Summary.Add('Commit: `${{ github.sha }}`')
          if (Test-Path 'test-results/windows-source.xml') {
            [xml]$JUnit = Get-Content 'test-results/windows-source.xml' -Raw
            foreach ($Suite in $JUnit.testsuites.testsuite) {
              $Summary.Add("Source tests: $($Suite.tests) tests, $($Suite.failures) failures, $($Suite.errors) errors, $($Suite.skipped) skipped.")
              foreach ($Case in $Suite.testcase) {
                foreach ($Failure in @($Case.failure, $Case.error)) {
                  if ($null -ne $Failure) {
                    $Summary.Add("### $($Case.name)")
                    $Summary.Add('```text')
                    $Summary.Add($Failure.InnerText)
                    $Summary.Add('```')
                  }
                }
              }
            }
          }
          foreach ($Report in @('frozen-self-test', 'frozen-smoke-gui', 'installed-self-test', 'installed-smoke-gui', 'upgrade-validation')) {
            $ReportPath = "test-results/$Report.json"
            if (Test-Path $ReportPath) {
              $Summary.Add("### $Report")
              $Summary.Add('```json')
              $Summary.Add((Get-Content $ReportPath -Raw))
              $Summary.Add('```')
            }
          }
          if (Test-Path 'dist/IronAnvil/IronAnvil.exe') {
            $Version = (Get-Item 'dist/IronAnvil/IronAnvil.exe').VersionInfo.FileVersion
            $Summary.Add("Executable file version: $Version")
          }
          if (Test-Path 'dist/SHA256SUMS.txt') {
            $Summary.Add('### Downloads and SHA-256')
            $Summary.Add('```text')
            $Summary.Add((Get-Content 'dist/SHA256SUMS.txt' -Raw))
            $Summary.Add('```')
          }
          if ('${{ job.status }}' -ne 'success' -and (Test-Path 'test-results/build-windows.log')) {
            $Summary.Add('### Last build output')
            $Summary.Add('```text')
            $Summary.Add(((Get-Content 'test-results/build-windows.log' -Tail 100) -join "`n"))
            $Summary.Add('```')
          }
          $Summary -join "`n`n" | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
      - name: Upload ready-to-share Windows download
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: IronAnvil-Windows-x64
          path: |
            dist/IronAnvil-Setup-x64.exe
            dist/IronAnvil-Windows-x64.zip
            dist/SHA256SUMS.txt
            dist/update.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve executable validation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-validation
          path: test-results/
          if-no-files-found: ignore
      - name: Preserve Windows application logs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-startup-logs
          path: ~/AppData/Local/IronAnvil/logs/
          if-no-files-found: ignore

  release:
    name: Publish the tested Windows download
    needs: [linux-runtime, build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: IronAnvil-Windows-x64
          path: release-assets
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Windows-validation
          path: release-assets/validation
      - name: Publish portable Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          tag="v${version}"
          (
            cd release-assets
            sha256sum --check SHA256SUMS.txt
          )
          python tools/write_update_manifest.py --installer release-assets/IronAnvil-Setup-x64.exe --output /tmp/verified-ironanvil-update.json
          cmp release-assets/update.json /tmp/verified-ironanvil-update.json
          cat > /tmp/ironanvil-release.md <<'NOTES'
          Download **IronAnvil-Setup-x64.exe** below, double-click it, and follow the installer. Then open **Iron Anvil** from the desktop or Start menu.

          No Python installation, commands, administrator access, or GitHub account is needed to run it.

          Already have Iron Anvil? Run this installer to update your existing installation. It keeps your selected installation folder, saved settings, and generated missions. There is no need to uninstall first. From this version onward, **Check for updates** in the application can download and verify future installers for you. Version 1.1 users need to download this update once.

          New in this version: dark/light mode, every airfield and heliport from all three map catalogues, more weather choices including rain, fog and strong winds, saved preferences, and in-application update checks. Helicopter-only bases require a helicopter; ground starts require enough compatible parking for the selected flight.

          Portable alternative: download **IronAnvil-Windows-x64.zip**, right-click it, choose **Extract All**, then double-click **IronAnvil.exe**. Keep the `_internal` folder beside the application.

          Choose your flight and mission, click **Generate mission**, and use **Open mission folder** to find the DCS `.miz` file. Share the ZIP with friends who want the generator; friends joining your DCS server only need DCS and the matching map/aircraft modules.

          This download is unsigned; Windows may display an unrecognized publisher prompt. Only use downloads from this repository's release or a copy from someone you trust.

          Validation: Windows application tests; 43 generated/reloaded missions covering all maps, mission types, opposition toggles, selected airfields and every weather preset; all 472 catalogue airfields/heliports; actual rain/fog/wind serialization; both desktop themes and saved-settings reload; bundled map/chart/projection checks; and an actual verified 1.1.0-to-current installer upgrade retaining a custom folder, preferences and mission bytes, followed by installed-app checks and uninstall. Linux and Lua 5.1 regression jobs must also pass before publication. An in-simulator DCS multiplayer flight is still needed.
          NOTES
          printf '\nBuilt from commit `%s`.\n' "$GITHUB_SHA" >> /tmp/ironanvil-release.md
          # Releases are immutable by version: never move a published tag or mix
          # assets from separate commits. Bump pyproject.toml for the next release.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; this run's ZIP remains available as a workflow artifact."
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Iron Anvil $version for Windows" --notes-file /tmp/ironanvil-release.md release-assets/IronAnvil-Setup-x64.exe release-assets/IronAnvil-Windows-x64.zip release-assets/SHA256SUMS.txt release-assets/update.json release-assets/validation/frozen-self-test.json release-assets/validation/frozen-smoke-gui.json release-assets/validation/installed-self-test.json release-assets/validation/installed-smoke-gui.json release-assets/validation/upgrade-validation.json
          fi
